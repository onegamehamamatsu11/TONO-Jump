
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>TONO-Jamp</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #unity-container {
      position: fixed !important;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      transform: none !important;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #unity-canvas {
      display: block;
      position: relative;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      background: #000;
      touch-action: none;
    }

    #unity-footer {
      display: none !important;
    }

    #unity-loading-bar {
      z-index: 10;
    }
  </style>
</head>

<body>
  <div id="unity-container" class="unity-mobile">

    <canvas id="unity-canvas"
            width="1080"
            height="1920"
            tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">TONO-Jamp</div>
    </div>

  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");

    function unityShowBanner(msg, type) {
      var warningBanner =
        document.querySelector("#unity-warning");

      function updateBannerVisibility() {
        warningBanner.style.display =
          warningBanner.children.length
            ? "block"
            : "none";
      }

      var div = document.createElement("div");
      div.textContent = msg;
      warningBanner.appendChild(div);

      if (type === "error") {
        div.style =
          "background: red; padding: 10px;";
      } else {
        if (type === "warning") {
          div.style =
            "background: yellow; padding: 10px;";
        }

        setTimeout(function () {
          if (div.parentNode) {
            warningBanner.removeChild(div);
          }
          updateBannerVisibility();
        }, 5000);
      }

      updateBannerVisibility();
    }

    // ゲームの基準解像度
    const GAME_WIDTH = 1080;
    const GAME_HEIGHT = 1920;

    // 画面サイズに合わせて縦横比を維持
    function resizeGame() {
      const screenWidth =
        document.documentElement.clientWidth;

      const screenHeight =
        window.visualViewport
          ? window.visualViewport.height
          : window.innerHeight;

      const scale = Math.min(
        screenWidth / GAME_WIDTH,
        screenHeight / GAME_HEIGHT
      );

      canvas.style.setProperty(
        "width",
        Math.floor(GAME_WIDTH * scale) + "px",
        "important"
      );

      canvas.style.setProperty(
        "height",
        Math.floor(GAME_HEIGHT * scale) + "px",
        "important"
      );
    }

    window.addEventListener("resize", resizeGame);

    if (window.visualViewport) {
      window.visualViewport.addEventListener(
        "resize",
        resizeGame
      );
    }

    resizeGame();

    var buildUrl = "Build";

    var loaderUrl =
      buildUrl + "/トノジャンプtab.loader.js";

    var config = {
      arguments: [],

      dataUrl:
        buildUrl + "/トノジャンプtab.data.unityweb",

      frameworkUrl:
        buildUrl +
        "/トノジャンプtab.framework.js.unityweb",

      codeUrl:
        buildUrl + "/トノジャンプtab.wasm.unityweb",

      streamingAssetsUrl: "StreamingAssets",

      companyName: "DefaultCompany",
      productName: "TONO-Jamp",
      productVersion: "1.0",

      showBanner: unityShowBanner
    };

    // モバイル端末の描画負荷を軽減
    if (/iPhone|iPad|iPod|Android/i.test(
      navigator.userAgent
    )) {
      config.devicePixelRatio = 1;
    }

    document.querySelector(
      "#unity-loading-bar"
    ).style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(
        canvas,
        config,
        (progress) => {
          document.querySelector(
            "#unity-progress-bar-full"
          ).style.width = (100 * progress) + "%";
        }
      ).then((unityInstance) => {
        document.querySelector(
          "#unity-loading-bar"
        ).style.display = "none";

        document.querySelector(
          "#unity-fullscreen-button"
        ).onclick = () => {
          unityInstance.SetFullscreen(1);
        };

        resizeGame();

      }).catch((message) => {
        alert(message);
      });
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
